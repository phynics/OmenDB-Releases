name: Publish OmenDB bundles

# Builds OmenDB distribution bundles and publishes them as GitHub Releases of this repo, then
# points channels/stable.json at them.
#
# Triggers:
# - archive-release (sent by OmenArchive's notify workflow when a release is published):
#   build every contract in omendb-contracts.json from that archive tag.
# - app-contract (sent when an OmenBuilder build needs content for a new contract): build the
#   given OmenBuilder commit from the latest archive release, and add its contract to the list.
# - workflow_dispatch: either of the above by hand.
#
# Builds only upload artifacts. The publish job runs only if every build succeeded and no bundle
# is dirty, so a failed run publishes nothing and leaves the channel unchanged.

on:
  repository_dispatch:
    types: [archive-release, app-contract]
  workflow_dispatch:
    inputs:
      archive_ref:
        description: "OmenArchive tag to build from (empty: its latest release)"
        required: false
      omenbuilder_rev:
        description: "Build only this OmenBuilder commit and add its contract (empty: every supported contract)"
        required: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  READ_TOKEN: ${{ secrets.OMEN_CI_READ_TOKEN }}

jobs:
  plan:
    runs-on: macos-26
    outputs:
      archive_ref: ${{ steps.plan.outputs.archive_ref }}
      matrix: ${{ steps.plan.outputs.matrix }}
      new_contract: ${{ steps.plan.outputs.new_contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: phynics/omen-monorepo
          path: monorepo
          fetch-depth: 0
          token: ${{ secrets.OMEN_CI_READ_TOKEN }}
      - name: Plan the builds
        id: plan
        env:
          ARCHIVE_REF: ${{ github.event.client_payload.archive_ref || inputs.archive_ref }}
          OMENBUILDER_REV: ${{ github.event.client_payload.omenbuilder_rev || inputs.omenbuilder_rev }}
          GH_TOKEN: ${{ secrets.OMEN_CI_READ_TOKEN }}
        run: |
          archive_ref="$ARCHIVE_REF"
          if [ -z "$archive_ref" ]; then
            archive_ref=$(gh release view --repo phynics/OmenArchive --json tagName --jq .tagName)
          fi
          test -n "$archive_ref" || { echo "::error::No OmenArchive release to build from"; exit 1; }
          echo "archive_ref=$archive_ref" >> "$GITHUB_OUTPUT"
          if [ -n "$OMENBUILDER_REV" ]; then
            matrix=$(jq -nc --arg rev "$OMENBUILDER_REV" '{include:[{rev:$rev,digest:""}]}')
            echo "new_contract=true" >> "$GITHUB_OUTPUT"
          else
            # Only commits of the workspace repository can be built here. A contract whose commit predates the
            # workspace repository keeps its last published release (see README, "Contracts").
            entries=""
            while IFS=$'\t' read -r rev digest; do
              if git -C monorepo cat-file -e "$rev^{commit}" 2>/dev/null; then
                entries="$entries$(jq -nc --arg rev "$rev" --arg digest "$digest" '{rev:$rev,digest:$digest}')"$'\n'
              else
                echo "::notice::Skipping contract $digest: $rev isn't a workspace repository commit"
              fi
            done < <(jq -r '.contracts[] | [.omenBuilderRev, .digest] | @tsv' omendb-contracts.json)
            matrix=$(printf '%s' "$entries" | jq -sc '{include: .}')
            echo "new_contract=false" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Building $matrix from OmenArchive $archive_ref"

  build:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: releases
      - uses: actions/checkout@v4
        with:
          repository: phynics/omen-monorepo
          ref: ${{ matrix.rev }}
          path: ws
          token: ${{ secrets.OMEN_CI_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: phynics/OmenArchive
          ref: ${{ needs.plan.outputs.archive_ref }}
          path: ws/OmenArchive
          token: ${{ secrets.OMEN_CI_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: phynics/omen-monorepo
          ref: main
          path: tooling
          sparse-checkout: tools/OmenDevTools
          token: ${{ secrets.OMEN_CI_READ_TOKEN }}
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Build the bundle (clean archive only)
        working-directory: ws/OmenBuilder
        run: make omendb ARCHIVE=../OmenArchive OUT="$RUNNER_TEMP/bundle" ALLOW_DIRTY= EXPECT_CONTRACT="${{ matrix.digest }}"
      - name: Build the release tools
        run: swift build -c release --package-path tooling/tools/OmenDevTools --product omen-dev
      - name: Check the bundle and name its release
        run: |
          omen_dev="$PWD/tooling/tools/OmenDevTools/.build/release/omen-dev"
          "$omen_dev" omendb-release check-bundle "$RUNNER_TEMP/bundle"
          archive_date=$(git -C ws/OmenArchive log -1 --format=%cd --date=format:%Y%m%d)
          "$omen_dev" omendb-release tag "$RUNNER_TEMP/bundle" --archive-date "$archive_date" > "$RUNNER_TEMP/bundle/tag.txt"
          echo "${{ matrix.rev }}" > "$RUNNER_TEMP/bundle/omenbuilder-rev.txt"
          cat "$RUNNER_TEMP/bundle/tag.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ strategy.job-index }}
          path: ${{ runner.temp }}/bundle

  publish:
    needs: [plan, build]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: phynics/omen-monorepo
          ref: main
          path: tooling
          sparse-checkout: tools/OmenDevTools
          token: ${{ secrets.OMEN_CI_READ_TOKEN }}
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Build the release tools
        run: swift build -c release --package-path tooling/tools/OmenDevTools --product omen-dev
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: Publish releases and update the channel
        run: |
          set -euo pipefail
          omen_dev="$PWD/tooling/tools/OmenDevTools/.build/release/omen-dev"
          for bundle in bundles/*/; do
            bundle=${bundle%/}
            tag=$(cat "$bundle/tag.txt")
            store=$(jq -r .store.file "$bundle/manifest.json")
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already published"
            else
              contract_prefix=${tag%/*}/
              previous=$(gh release list --limit 200 --json tagName,createdAt \
                --jq "[.[] | select(.tagName | startswith(\"$contract_prefix\"))] | sort_by(.createdAt) | last | .tagName // empty")
              if [ -n "$previous" ]; then
                gh release download "$previous" -p manifest.json -p records.txt -D "$RUNNER_TEMP/previous-$tag"
                "$omen_dev" omendb-release notes "$bundle" --previous "$RUNNER_TEMP/previous-$tag" > "$RUNNER_TEMP/notes.md"
              else
                "$omen_dev" omendb-release notes "$bundle" > "$RUNNER_TEMP/notes.md"
              fi
              gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" \
                "$bundle/$store" "$bundle/manifest.json" "$bundle/LICENSE.md" "$bundle/records.txt"
            fi
            "$omen_dev" omendb-release update-channel channels/stable.json "$bundle/manifest.json" \
              --manifest-url "https://github.com/${{ github.repository }}/releases/download/$tag/manifest.json"
            if [ "${{ needs.plan.outputs.new_contract }}" = "true" ]; then
              digest=$(jq -r .mechanicsContractDigest "$bundle/manifest.json")
              jq -S --arg digest "$digest" --arg rev "$(cat "$bundle/omenbuilder-rev.txt")" \
                'if any(.contracts[]; .digest == $digest) then . else .contracts += [{digest: $digest, omenBuilderRev: $rev}] end' \
                omendb-contracts.json > "$RUNNER_TEMP/contracts.json"
              mv "$RUNNER_TEMP/contracts.json" omendb-contracts.json
            fi
          done
          git config user.name "omendb-release-bot"
          git config user.email "omendb-release-bot@users.noreply.github.com"
          git add channels/stable.json omendb-contracts.json
          if git diff --cached --quiet; then
            echo "The channel is unchanged"
          else
            git commit -m "Publish OmenDB bundles for OmenArchive ${{ needs.plan.outputs.archive_ref }}"
            git push
          fi
