name: Prune unsupported contracts

# Weekly: removes channel entries for contracts that omendb-contracts.json no longer
# lists, keeping the newest KEEP of them, and deletes the releases of the contracts it removed.
# To retire an app build's contract, delete its entry from omendb-contracts.json.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  KEEP: 3

jobs:
  prune:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: phynics/omen-monorepo
          ref: main
          path: tooling
          sparse-checkout: tools/OmenDevTools
          token: ${{ secrets.OMEN_CI_READ_TOKEN }}
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode"
      - name: Build the release tools
        run: swift build -c release --package-path tooling/tools/OmenDevTools --product omen-dev
      - name: Prune the channel and old releases
        run: |
          set -euo pipefail
          before=$(jq -r '[.entries[].mechanicsContractDigest] | unique | join(" ")' channels/stable.json)
          "$PWD/tooling/tools/OmenDevTools/.build/release/omen-dev" omendb-release prune omendb-contracts.json channels/stable.json --keep "$KEEP"
          after=$(jq -r '[.entries[].mechanicsContractDigest] | unique | join(" ")' channels/stable.json)
          for digest in $before; do
            case " $after " in *" $digest "*) continue ;; esac
            prefix="omendb/$(printf '%s' "$digest" | shasum -a 256 | cut -c1-8)/"
            for tag in $(gh release list --limit 500 --json tagName --jq ".[] | select(.tagName | startswith(\"$prefix\")) | .tagName"); do
              gh release delete "$tag" --yes --cleanup-tag
            done
          done
          git config user.name "omendb-release-bot"
          git config user.email "omendb-release-bot@users.noreply.github.com"
          git add channels/stable.json
          git diff --cached --quiet || { git commit -m "Prune unsupported OmenDB contracts"; git push; }
